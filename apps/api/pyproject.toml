[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Auto-generated by Django; kept verbatim so revisions stay reproducible.
"**/migrations/*.py" = ["E501"]
# Localized seed copy: wrapping Persian sentences hurts readability more than long lines.
"apps/catalog/management/commands/seed_demo_catalog.py" = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-q"
