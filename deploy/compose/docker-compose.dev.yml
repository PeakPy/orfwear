services:
  api:
    build:
      context: ../../apps/api
      dockerfile: ../docker/api.Dockerfile.dev
    volumes:
      - ../../apps/api:/app
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]

  worker:
    build:
      context: ../../apps/api
      dockerfile: ../docker/api.Dockerfile.dev
    volumes:
      - ../../apps/api:/app
    command: ["celery", "-A", "config.celery", "worker", "-l", "info"]

  web:
    build:
      context: ../../apps/web
      dockerfile: ../docker/web.Dockerfile.dev
    volumes:
      - ../../apps/web:/app
      - /app/node_modules
      - /app/.next
    environment:
      WATCHPACK_POLLING: "true"
    command: ["npm", "run", "dev"]

  # Optional: docker compose -f deploy/compose/docker-compose.dev.yml --profile admin up admin
  admin:
    profiles: ["admin"]
    build:
      context: ../../apps/admin
      dockerfile: ../docker/admin.Dockerfile.dev
    volumes:
      - ../../apps/admin:/app
      - /app/node_modules
      - /app/.next
    environment:
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_ADMIN_API_BASE_URL:-http://localhost:8001/api/v1}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_ADMIN_APP_URL:-http://localhost:3001}
    ports:
      - "3001:3001"
    command: ["npm", "run", "dev"]