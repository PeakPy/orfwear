# Production-oriented overrides. Build & push images in CI, then deploy.
services:
  api:
    image: ${API_IMAGE:-orfwear-api:latest}
    build: null
    restart: always
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_DEBUG: "false"

  worker:
    image: ${API_IMAGE:-orfwear-api:latest}
    build: null
    restart: always
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_DEBUG: "false"

  web:
    image: ${WEB_IMAGE:-orfwear-web:latest}
    build: null
    restart: always
    environment:
      NODE_ENV: production

  postgres:
    restart: always

  redis:
    restart: always
